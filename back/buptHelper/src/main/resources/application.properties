spring.application.name=buptHelper
server.port=8080

# ---------- 数据源：MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/bupt_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
# 课程原型项目，交由 Hibernate 自动建表/补表；正式环境应改为 validate + 手工脚本
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# 生产环境请通过环境变量 BUPT_HELPER_JWT_SECRET 覆盖，密钥长度不少于 32 字节
bupthelper.jwt.secret=${BUPT_HELPER_JWT_SECRET:LSKxVoMU1tmFEriB/yuOUeuN7YbU0WS5Fag0Bea1s+LMil7o62fVT5JYrQ3uvM6K}
bupthelper.jwt.issuer=bupt-helper
# 未勾选“记住我”：2 小时；勾选：7 天
bupthelper.jwt.expire-seconds=7200
bupthelper.jwt.remember-me-expire-seconds=604800

# ---------- 文件上传 ----------
spring.servlet.multipart.max-file-size=110MB
spring.servlet.multipart.max-request-size=120MB
# 附件存储根目录（按 yyyy/MM/{uuid}.{ext} 分片存储）
bupthelper.upload.dir=D:/workspace/creations/bupt_helper/store

# ---------- 日志（禁止输出密码与令牌） ----------
logging.level.com.aurxsiu.bupthelper=INFO
