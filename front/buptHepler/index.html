<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="好帮手校园互助平台 - 用户登录" />
    <title>登录 - 好帮手</title>
  </head>
  <body class="auth-body">
    <main class="row g-0 min-vh-100">
      <section class="col-lg-6 col-xl-7 auth-brand d-none d-lg-flex flex-column justify-content-between">
        <div>
          <span class="auth-brand__logo">好帮手 · 校园互助</span>
          <h1 class="auth-brand__title">让每一次“请帮忙”<br />都有人回应</h1>
          <p class="auth-brand__desc">
            发布需求、响应需求、统计分析，一个平台完成校园互助全流程。
          </p>
        </div>

        <ul class="auth-brand__features list-unstyled mb-0">
          <li>发布“请帮忙”需求，支持文字、图片与视频说明</li>
          <li>一键“我来也”，帮助他人也被看见</li>
          <li>管理员可查看月度互助统计与图表</li>
        </ul>

        <p class="auth-brand__footer mb-0">北京邮电大学 · 好帮手原型系统</p>
      </section>

      <section class="col-lg-6 col-xl-5 auth-panel d-flex align-items-center justify-content-center">
        <div class="auth-card w-100">
          <div class="d-lg-none mb-4">
            <span class="auth-brand__logo auth-brand__logo--dark">好帮手 · 校园互助</span>
          </div>

          <h2 class="h4 fw-bold mb-2">欢迎回来</h2>
          <p class="text-body-secondary small mb-4">请输入用户名和密码登录系统</p>

          <div id="login-alert" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="username">用户名</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="username"
                name="username"
                placeholder="请输入用户名"
                autocomplete="username"
                maxlength="50"
                required
              />
              <div class="form-text" data-feedback-for="username"></div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">密码</label>
              <div class="input-group input-group-lg has-validation">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="请输入密码"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="toggle-password"
                  aria-label="显示密码"
                >
                  显示
                </button>
                <div class="invalid-feedback" data-feedback-for="password"></div>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember-me" name="rememberMe" />
              <label class="form-check-label small" for="remember-me">
                记住我（7 天内免登录）
              </label>
            </div>

            <button type="submit" class="btn btn-dark btn-lg w-100" id="login-submit">
              <span
                class="spinner-border spinner-border-sm me-2 d-none"
                data-loading-spinner
                aria-hidden="true"
              ></span>
              <span data-loading-text>登录</span>
            </button>
          </form>

          <hr class="my-4" />

          <p class="text-center small text-body-secondary mb-2">
            还没有账号？<a href="./register.html" class="link-dark link-offset-2">立即注册</a>
          </p>
          <p class="text-center small text-body-secondary mb-0">忘记密码请联系系统管理员重置</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
