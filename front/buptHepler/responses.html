<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="好帮手校园互助平台 - 我来也：全部需求" />
    <title>我来也 - 好帮手</title>
  </head>
  <body class="app-body">
    <nav class="navbar navbar-expand border-bottom app-navbar">
      <div class="container flex-wrap gap-2">
        <a class="navbar-brand fw-bold me-0" href="./home.html">好帮手</a>
        <ul class="nav nav-underline app-navbar__links me-auto">
          <li class="nav-item"><a class="nav-link" href="./home.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="./requests.html">请帮忙</a></li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./responses.html">我来也</a>
          </li>
          <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">统计分析</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 gap-sm-3">
          <span class="small text-body-secondary d-none" id="nav-role"></span>
          <span class="small text-body-secondary text-truncate" id="nav-user">加载中…</span>
          <a class="btn btn-outline-secondary btn-sm" href="./profile.html">修改信息</a>
          <button class="btn btn-outline-secondary btn-sm" type="button" id="logout-button">
            退出登录
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <div id="page-alert" class="alert d-none" role="alert" aria-live="polite"></div>

      <header class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
        <div>
          <h1 class="h3 fw-bold mb-2">我来也</h1>
          <p class="text-body-secondary mb-0">
            浏览全部“请帮忙”需求；你已响应的需求会优先展示，点击即可查看详情或提交响应。
          </p>
        </div>
        <a class="btn btn-outline-dark" href="./my-responses.html">查看我的响应</a>
      </header>

      <section class="card mb-4">
        <div class="card-body">
          <form id="filter-form" class="row g-3 align-items-end" novalidate>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label small text-body-secondary" for="type-filter">帮忙类型</label>
              <select class="form-select" id="type-filter" name="typeCode">
                <option value="">全部类型</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label small text-body-secondary" for="region-filter">地域</label>
              <select class="form-select" id="region-filter" name="regionId">
                <option value="">全部地域</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label small text-body-secondary" for="keyword">关键词</label>
              <input
                type="search"
                class="form-control"
                id="keyword"
                name="keyword"
                maxlength="50"
                placeholder="主题或描述"
                autocomplete="off"
              />
            </div>
            <div class="col-lg-3 d-flex gap-2">
              <button type="submit" class="btn btn-dark flex-fill">查询</button>
              <button type="reset" class="btn btn-outline-secondary flex-fill">重置</button>
            </div>
          </form>
        </div>
      </section>

      <div id="list-alert" class="alert d-none" role="alert" aria-live="polite"></div>

      <section class="card">
        <div class="card-header bg-transparent d-flex flex-wrap align-items-center justify-content-between gap-2">
          <span class="small text-body-secondary" id="page-summary">正在加载…</span>
          <label class="d-flex align-items-center gap-2 small text-body-secondary mb-0">
            每页
            <select class="form-select form-select-sm w-auto" id="page-size" aria-label="每页条数">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
            </select>
            条
          </label>
        </div>

        <div class="table-responsive" id="request-table-wrapper">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr class="small text-body-secondary">
                <th scope="col">需求主题</th>
                <th scope="col">帮忙类型</th>
                <th scope="col">地域</th>
                <th scope="col">响应</th>
                <th scope="col">创建时间</th>
                <th scope="col" class="text-end">操作</th>
              </tr>
            </thead>
            <tbody id="request-tbody">
              <tr>
                <td colspan="6" class="text-center text-body-secondary py-4">正在加载…</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="card-body d-none" id="empty-state">
          <div class="text-center py-5">
            <p class="text-body-secondary mb-0" id="empty-text">当前没有可响应的“请帮忙”需求。</p>
          </div>
        </div>

        <div class="card-footer bg-transparent d-flex justify-content-center py-3">
          <nav aria-label="需求列表分页" id="pagination" class="d-none"></nav>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/responses.js"></script>
  </body>
</html>
