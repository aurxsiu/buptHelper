<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="好帮手校园互助平台 - 用户注册" />
    <title>注册 - 好帮手</title>
  </head>
  <body class="auth-body">
    <main class="row g-0 min-vh-100">
      <section class="col-lg-5 col-xl-6 auth-brand d-none d-lg-flex flex-column justify-content-between">
        <div>
          <span class="auth-brand__logo">好帮手 · 校园互助</span>
          <h1 class="auth-brand__title">注册账号<br />开启互助之旅</h1>
          <p class="auth-brand__desc">
            注册后即可发布“请帮忙”需求，或作为“我来也”响应他人的请求。
          </p>
        </div>

        <ul class="auth-brand__features list-unstyled mb-0">
          <li>需求信息支持分页查询与条件筛选</li>
          <li>响应信息可修改、可撤回</li>
          <li>被接受后自动生成互助成功记录</li>
        </ul>

        <p class="auth-brand__footer mb-0">北京邮电大学 · 好帮手原型系统</p>
      </section>

      <section class="col-lg-7 col-xl-6 auth-panel d-flex align-items-center justify-content-center">
        <div class="auth-card auth-card--wide w-100">
          <div class="d-lg-none mb-4">
            <span class="auth-brand__logo auth-brand__logo--dark">好帮手 · 校园互助</span>
          </div>

          <h2 class="h4 fw-bold mb-2">创建账号</h2>
          <p class="text-body-secondary small mb-4">带 <span class="text-danger">*</span> 的为必填项</p>

          <div id="register-alert" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="register-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="username">用户名 <span class="text-danger">*</span></label>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                placeholder="3~20 位字母、数字或下划线"
                autocomplete="username"
                maxlength="20"
                required
              />
              <div class="form-text" data-feedback-for="username">登录时使用，注册后不可修改</div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label" for="realName">姓名 <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  id="realName"
                  name="realName"
                  placeholder="请输入真实姓名"
                  autocomplete="name"
                  maxlength="20"
                  required
                />
                <div class="invalid-feedback" data-feedback-for="realName"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="phone">手机号码 <span class="text-danger">*</span></label>
                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  name="phone"
                  placeholder="11 位手机号"
                  autocomplete="tel"
                  inputmode="numeric"
                  maxlength="11"
                  required
                />
                <div class="invalid-feedback" data-feedback-for="phone"></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">密码 <span class="text-danger">*</span></label>
              <div class="input-group has-validation">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="请输入密码"
                  autocomplete="new-password"
                  maxlength="20"
                  required
                />
                <button
                  class="btn btn-outline-secondary"
                  type="button"
                  id="toggle-password"
                  aria-label="显示密码"
                >
                  显示
                </button>
                <div class="invalid-feedback" data-feedback-for="password"></div>
              </div>
              <div class="form-text" id="password-hint"></div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="confirmPassword">
                确认密码 <span class="text-danger">*</span>
              </label>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="请再次输入密码"
                autocomplete="new-password"
                maxlength="20"
                required
              />
              <div class="invalid-feedback" data-feedback-for="confirmPassword"></div>
            </div>

            <div class="mb-4">
              <label class="form-label" for="bio">用户简介</label>
              <textarea
                class="form-control"
                id="bio"
                name="bio"
                rows="3"
                maxlength="200"
                placeholder="介绍一下自己，方便他人了解你（选填）"
              ></textarea>
              <div class="invalid-feedback" data-feedback-for="bio"></div>
            </div>

            <button type="submit" class="btn btn-dark btn-lg w-100" id="register-submit">
              <span
                class="spinner-border spinner-border-sm me-2 d-none"
                data-loading-spinner
                aria-hidden="true"
              ></span>
              <span data-loading-text>注册</span>
            </button>
          </form>

          <hr class="my-4" />

          <p class="text-center small text-body-secondary mb-0">
            已有账号？<a href="./index.html" class="link-dark link-offset-2">返回登录</a>
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/register.js"></script>
  </body>
</html>
